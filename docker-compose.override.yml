services:
   app:
      container_name: graphandphotos-dev
      # Image locale distincte — ne pas réutiliser dockerhub…/graphandphotos:latest (CMD = node server.js)
      image: graphandphotos-dev:latest
      build:
         context: .
         dockerfile: Dockerfile.dev
         tags:
            - graphandphotos-dev:latest
      command: ["npm", "run", "dev"]
      read_only: false
      cpus: 2
      mem_limit: 4g
      ports:
         - "3000:3000"
      env_file:
         - .env
      volumes:
         - .:/app
         - /app/node_modules
         - /app/.next
      environment:
         NODE_ENV: development
         PORT: 3000
         HOSTNAME: 0.0.0.0
         DB_HOST: mysql
         DB_PORT: 3306
         DB_DATABASE: graphandco_drive
         DB_USER: drive
         DB_PASSWORD: drive
         # Régis + 6-MyK : endpoints Unraid via .env
         # Public : VPS
         STORAGE_PUBLIC_ENDPOINT: https://s3.graphandco.com
         STORAGE_ENDPOINT: https://s3.graphandco.com
         STORAGE_KEY_PREFIX: dev
      depends_on:
         mysql:
            condition: service_healthy
      networks:
         - web-network

   mysql:
      image: mysql:8.0
      container_name: graphandco-drive-mysql
      restart: unless-stopped
      ports:
         - "3307:3306"
      environment:
         MYSQL_DATABASE: graphandco_drive
         MYSQL_USER: drive
         MYSQL_PASSWORD: drive
         MYSQL_ROOT_PASSWORD: root
      volumes:
         - drive_mysql_data:/var/lib/mysql
         - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      networks:
         - web-network
      command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      healthcheck:
         test:
            ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
         interval: 5s
         timeout: 5s
         retries: 20
         start_period: 20s

volumes:
   drive_mysql_data:

networks:
   web-network:
      external: true
