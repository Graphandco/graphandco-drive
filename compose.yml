services:
   app:
      platform: linux/amd64
      container_name: graphandphotos
      image: dockerhub.graphandco.com/graphandphotos:latest
      build:
         context: .
         dockerfile: Dockerfile
         tags:
            - dockerhub.graphandco.com/graphandphotos:1.0.0
            - dockerhub.graphandco.com/graphandphotos:latest
      restart: unless-stopped
      env_file:
         - .env
      environment:
         NODE_ENV: production
         DB_HOST: my-sql
         # Régis + 6-MyK : Unraid via .env (STORAGE_REGIS_* / STORAGE_6-MYK_*)
         # Public : SeaweedFS local VPS
         STORAGE_PUBLIC_ENDPOINT: http://seaweedfs:8336
         STORAGE_ENDPOINT: http://seaweedfs:8336
         STORAGE_KEY_PREFIX: ""
      networks:
         - web-network
      cpus: 0.5
      mem_limit: 512m
      security_opt:
         - no-new-privileges:true
      tmpfs:
         - /tmp:rw,noexec,nosuid,size=128m
      volumes:
         - next_cache:/app/.next/cache
      logging:
         driver: json-file
         options:
            max-size: 10m
            max-file: "3"

volumes:
   next_cache:

networks:
   web-network:
      external: true
